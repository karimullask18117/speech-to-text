server.port=${PORT:8080}

# ---- Database (PostgreSQL by default; override via env vars) ----
# MySQL: SPRING_DATASOURCE_URL=jdbc:mysql://host:3306/speech
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:speech}}
spring.datasource.username=${DB_USER:speech}
spring.datasource.password=${DB_PASSWORD:speech}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Gemini Live API ----
gemini.api-key=${GEMINI_API_KEY:}
# Model id of the Live model you have access to (see https://ai.google.dev/gemini-api/docs/live-api)
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-live-preview}
gemini.endpoint=wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent
gemini.finalize-delay-ms=1500

management.endpoints.web.exposure.include=health
