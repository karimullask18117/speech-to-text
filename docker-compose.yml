services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: speech
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speech"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DB_HOST: db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-live-preview}
    ports: ["8080:8080"]
volumes:
  pgdata:
