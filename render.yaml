# Render Blueprint: New > Blueprint > pick this repo. Free web service + free Postgres.
services:
  - type: web
    name: speech-to-text
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-live-preview
      - {key: DB_HOST, fromDatabase: {name: speech-db, property: host}}
      - {key: DB_PORT, fromDatabase: {name: speech-db, property: port}}
      - {key: DB_NAME, fromDatabase: {name: speech-db, property: database}}
      - {key: DB_USER, fromDatabase: {name: speech-db, property: user}}
      - {key: DB_PASSWORD, fromDatabase: {name: speech-db, property: password}}
databases:
  - name: speech-db
    plan: free
    databaseName: speech
    user: speech
